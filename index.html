<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Videira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#0B1F3A; --navy-2:#132a4d; --blue:#1D5FA8; --turq:#0F9C93; --aqua:#3FD9C7; --purple:#6C4FA1;
  --white:#ffffff; --bg:#F4F7FB; --surface:#ffffff; --ink:#0F1B33; --muted:#6C7A94; --line:#E6ECF4;
  --danger:#C0392B; --shadow: 0 1px 2px rgba(15,31,58,.04), 0 8px 24px -12px rgba(15,31,58,.12);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1424; --surface:#101E36; --ink:#EAF0FA; --muted:#93A2C0; --line:#1E2E4B; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{ --bg:#0A1424; --surface:#101E36; --ink:#EAF0FA; --muted:#93A2C0; --line:#1E2E4B; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.5);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
.app{display:flex;min-height:100%;}

.sidebar{width:266px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;padding-top:calc(22px + env(safe-area-inset-top,0px));}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.brand-mark{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:3px;}
.brand-text .name{font-weight:800;font-size:17px;}
.brand-text .tag{font-size:10.5px;letter-spacing:1.4px;color:#9FB3D6;text-transform:uppercase;font-weight:600;}
.role-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;margin-bottom:14px;}
.role-box label{font-size:10.5px;color:#9FB3D6;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.role-box select{width:100%;margin-top:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px;border-radius:8px;font-size:13px;font-weight:600;}
.role-box select option{color:#0F1B33;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:#C7D4EA;transition:background .15s ease,color .15s ease;}
.nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.9;}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav a.active{background:rgba(63,217,199,.14);color:#fff;box-shadow:inset 3px 0 0 var(--aqua);}
.sidebar-foot{margin-top:auto;padding:14px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8CA0C4;line-height:1.5;}

.main{flex:1;min-width:0;}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px 28px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.hamburger{display:none;background:none;border:none;padding:8px;border-radius:8px;color:var(--ink);}
.hamburger:hover{background:var(--line);}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.content{padding:26px 28px 60px;max-width:1180px;}

.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 60%,var(--turq) 130%);border-radius:20px;padding:30px 32px;color:#fff;margin-bottom:26px;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(63,217,199,.35),transparent 70%);}
.hero .eyebrow{font-size:12.5px;color:#B9D4EA;font-weight:600;margin-bottom:6px;}
.hero h2{font-size:26px;margin:0 0 8px;font-weight:800;}
.hero p{margin:0;color:#D6E4F4;font-size:14.5px;max-width:520px;line-height:1.55;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;transition:transform .15s ease;}
.card.link:hover{transform:translateY(-2px);}
.card .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;}
.card .icon svg{width:22px;height:22px;}
.card h3{margin:0;font-size:16px;font-weight:700;}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5;}
.card .go{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);margin-top:auto;}
.card .go svg{width:15px;height:15px;}

.ic-teal{background:linear-gradient(135deg,#17B3A3,#0C7F73);}
.ic-blue{background:linear-gradient(135deg,#2C7BD1,#144B85);}
.ic-purple{background:linear-gradient(135deg,#7B5AC0,#4C3480);}
.ic-navy{background:linear-gradient(135deg,#274674,#0B1F3A);}
.ic-aqua{background:linear-gradient(135deg,#37D3B8,#0E9E8C);}
.ic-magenta{background:linear-gradient(135deg,#8A5AC7,#5A3B8A);}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px;}
.sec-head h2{font-size:17px;margin:0;font-weight:700;}
.sec-head .muted{font-size:12.5px;color:var(--muted);}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.row .rtitle{font-weight:600;font-size:14px;}
.row .rsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.row .rright{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;display:flex;align-items:center;gap:10px;}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap;}
.pill.ok{background:#E4F7F1;color:#0C7F5C;}
.pill.wait{background:#FDEFE0;color:#B4650C;}
.pill.info{background:#E7EEFB;color:#1E4F9C;}
.pill.bad{background:#FBE6E3;color:#B23425;}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h2{font-size:22px;margin:0 0 6px;font-weight:800;}
.page-head p{margin:0;color:var(--muted);font-size:14px;max-width:520px;}
.btn{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{background:var(--blue);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:#FBE6E3;color:var(--danger);}
.btn svg{width:16px;height:16px;}
.iconbtn{background:none;border:none;color:var(--muted);padding:6px;border-radius:8px;display:inline-flex;}
.iconbtn:hover{background:var(--line);color:var(--ink);}
.iconbtn svg{width:16px;height:16px;}
.iconbtn.del:hover{color:var(--danger);background:#FBE6E3;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat .n{font-size:24px;font-weight:800;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.stat.warn .n{color:#B4650C;}
.stat.bad .n{color:var(--danger);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;min-width:560px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:14px 18px;border-bottom:1px solid var(--line);}
td{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;}
tr:last-child td{border-bottom:none;}

.cell-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.person{display:flex;align-items:center;gap:10px;}
.person .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tab{padding:8px 14px;border-radius:100px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.reminder{background:#FDF3E4;border:1px solid #F0DBAF;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13.5px;color:#8A5A0C;font-weight:600;}
.reminder svg{width:17px;height:17px;flex-shrink:0;}
.reminder button{margin-left:auto;background:#8A5A0C;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;}

.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress{flex:1;height:8px;border-radius:100px;background:var(--line);overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--turq),var(--aqua));}
.progress-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}

.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:14px;}
.detail-back svg{width:15px;height:15px;}
.subblock{margin-top:26px;}
.subblock h4{font-size:14.5px;margin:0 0 10px;font-weight:700;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.info-grid div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px;}
.info-grid div b{font-size:13.5px;font-weight:600;}

.check-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.check-row:last-child{border-bottom:none;}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--turq);flex-shrink:0;}
.check-row .ctitle{font-weight:600;font-size:13.5px;}
.check-row .ctitle.done{text-decoration:line-through;color:var(--muted);}
.check-row .csub{font-size:12px;color:var(--muted);}

.overlay{position:fixed;inset:0;background:rgba(11,31,58,.5);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:19;}
.overlay.show{opacity:1;pointer-events:auto;}
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow-y:auto;padding:40px 16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;padding:24px 26px 26px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:800;}
.modal .msub{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:var(--bg);color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.checkline input{width:16px;height:16px;accent-color:var(--turq);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 28px;max-width:360px;width:100%;box-shadow:var(--shadow);}

@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}.stats{grid-template-columns:repeat(2,1fr);}.cell-grid{grid-template-columns:repeat(2,1fr);}.info-grid{grid-template-columns:1fr;}}
@media (max-width:720px){
  .sidebar{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .22s ease;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:inline-flex;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .grid{grid-template-columns:1fr;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .cell-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .hero{padding:24px;}.hero h2{font-size:21px;}
}
</style>
</head>

let STATE;
function load(){
  try{const raw=localStorage.getItem(LSKEY);STATE=raw?JSON.parse(raw):seed();if(!raw)save();}catch(e){STATE=seed();}
  if(!STATE.comunicados)STATE.comunicados=[];
  STATE.users.forEach(u=>{if(!u.senha)u.senha=DEFAULT_SENHA;});
  STATE.celulas.forEach(c=>{if(!c.comunicados)c.comunicados=[];});
  STATE.eventos.forEach(e=>{
    if(e.checklist===undefined)e.checklist=[];
    if(e.data===undefined)e.data='';
    if(e.local===undefined)e.local='';
    if(e.descricao===undefined)e.descricao='';
    if(e.usarFuncoes===undefined){e.usarFuncoes=false;e.funcoes=[];}
    if(e.usarEquipes===undefined){e.usarEquipes=false;e.equipes=[];}
    if(e.usarCelulas===undefined){e.usarCelulas=false;e.celulasEnvolvidas=[];}
    (e.celulasEnvolvidas||[]).forEach(c=>{if(c.prazo===undefined)c.prazo='';if(!c.checklist)c.checklist=[];});
    if(e.usarMinistradores===undefined){e.usarMinistradores=false;e.ministradores=[];}
    if(e.usarCronograma===undefined){e.usarCronograma=false;e.cronograma=[];}
  });
}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(STATE));}catch(e){}}

let SESSION=null;
function setSessionFromUser(u){SESSION={role:u.papel,celulaId:u.celulaId||null,userId:u.id,nome:u.nome};}
function usersList(){
  return STATE.users.map(u=>{
    const roleLabel=u.papel==='pastor'?'Pastor':u.papel==='admin'?'Administrador':'Líder';
    const celula=u.papel==='lider'&&u.celulaId?celulaById(u.celulaId):null;
    const extra=u.papel==='lider'?(celula?' ('+celula.nome+')':' (sem célula vinculada)'):'';
    return {value:u.id,label:roleLabel+' — '+u.nome+extra,role:u.papel,celulaId:u.celulaId||null,nome:u.nome};
  });
}

function tryAutoLogin(){
  try{
    const savedId=localStorage.getItem(SESSKEY);
    if(savedId){const u=STATE.users.find(x=>x.id===savedId); if(u){setSessionFromUser(u); return true;}}
  }catch(e){}
  return false;
}
function showLogin(msg){
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  const err=document.getElementById('loginError');
  if(msg){err.textContent=msg;err.style.display='block';} else {err.style.display='none';}
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
}
function doLogin(){
  const nome=document.getElementById('loginNome').value.trim();
  const senha=document.getElementById('loginSenha').value;
  if(!nome||!senha){showLogin('Preencha nome e senha.');return;}
  const u=STATE.users.find(x=>x.nome.trim().toLowerCase()===nome.toLowerCase());
  if(u&&u.senha===senha){
    setSessionFromUser(u);
    try{localStorage.setItem(SESSKEY,u.id);}catch(e){}
    showApp();renderShell();route();
  } else {
    showLogin('Nome ou senha inválidos.');
  }
}
function logout(){
  try{localStorage.removeItem(SESSKEY);}catch(e){}
  SESSION=null;
  document.getElementById('loginNome').value='';
  document.getElementById('loginSenha').value='';
  showLogin();
}

  document.getElementById('modalOverlay').classList.add('show');

  const rows=list.map(e=>{const c=celulaById(e.celulaId);return `<div class="row"><div><div class="rtitle">${e.culto} — ${fmtDate(e.data)}</div><div class="rsub">${c?c.nome+' · Líder: '+c.lider.nome:'célula não definida'}</div></div><a class="rright" href="#/celulas/${e.celulaId}" onclick="closeModal()">Distribuir ${icon('chev',14)}</a></div>`;}).join('')||'<div class="row"><span class="rsub">Nenhuma escala pendente 🎉</span></div>';

  const list=STATE.emprestimos.filter(e=>e.devolverAte<todayISO()&&e.status!=='ok');
  const rows=list.map(e=>`<div class="row"><div><div class="rtitle">${e.item}</div><div class="rsub">Com: ${e.pessoa} · Devolver até ${fmtDate(e.devolverAte)}</div></div></div>`).join('')||'<div class="row"><span class="rsub">Nenhum empréstimo atrasado 🎉</span></div>';
  document.getElementById('modalBox').innerHTML=`<h3>Empréstimos atrasados</h3><div class="list">${rows}</div><div class="modal-actions"><button type="button" class="btn ghost" id="modalCancel">Fechar</button></div>`;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalCancel').onclick=closeModal;
}
function pendencias(){
  const semTarefas=STATE.escalas.filter(e=>e.data>=todayISO()&&!e.tarefasDistribuidas).length;
  const emprestimosAtrasados=STATE.emprestimos.filter(e=>e.devolverAte<todayISO()&&e.status!=='ok').length;
  const mesAtual=todayISO().slice(5,7);
  let bdays=0; STATE.celulas.forEach(c=>c.membros.forEach(m=>{if(m.nascimento&&m.nascimento.slice(5,7)===mesAtual)bdays++;}));
  const reunioesHoje=STATE.agenda.filter(a=>a.data===todayISO()&&(a.userId===SESSION.userId||a.compartilhado)).length;
  const reunioesSemana=STATE.agenda.filter(a=>a.userId===SESSION.userId||a.compartilhado).length;
  return {semTarefas,emprestimosAtrasados,bdays,reunioesHoje,reunioesSemana};
}

  const mods=visibleModules().filter(m=>m.id!=='overview').map(m=>`<a class="card link" href="#/${m.id}"><div class="icon ${m.cls}">${icon(m.icon)}</div><div><h3>${m.label}</h3><p>${moduleBlurb(m.id)}</p></div><div class="go">Acessar ${icon('chev',15)}</div></a>`).join('');
  const escalaVis=SESSION.role==='lider'?STATE.escalas.filter(e=>e.celulaId===SESSION.celulaId):STATE.escalas;
  const escalaRows=escalaVis.slice(0,3).map(e=>{const c=celulaById(e.celulaId);return `<div class="row"><span class="dot" style="background:var(--blue)"></span><div><div class="rtitle">${e.culto} — ${fmtDate(e.data)}</div><div class="rsub">${c?c.nome:''}</div></div><div class="rright">${pill(e.tarefasDistribuidas?'ok':'wait',e.tarefasDistribuidas?'Tarefas distribuídas':'Pendente')}</div></div>`;}).join('')||'<div class="row"><span class="rsub">Nenhuma escala.</span></div>';
  const eventoRows=STATE.eventos.map(ev=>{const done=ev.checklist.filter(c=>c.concluido).length;return `<div class="row"><span class="dot" style="background:var(--turq)"></span><div><div class="rtitle">${ev.nome}</div><div class="rsub">${done}/${ev.checklist.length} tarefas concluídas</div></div><a class="rright" href="#/eventos/${ev.id}">Ver ${icon('chev',14)}</a></div>`;}).join('');
  const comunicadoRows=comunicadosVisiveis().slice(0,6).map(comunicadoRow).join('')||'<div class="row"><span class="rsub">Nenhum comunicado por aqui.</span></div>';
  return `
  <div class="hero"><div class="eyebrow">BEM-VINDO(A)</div><h2>${SESSION.role==='lider'?'Líder, este é o seu painel.':SESSION.role==='admin'?'Administrador, este é o seu painel.':'Pastor(a), este é o seu painel.'}</h2><p>Aqui você encontra tudo o que precisa para servir e caminhar com a nossa igreja. ${versiculo()}</p></div>
  <div class="sec-head" style="margin-top:0"><h2>Comunicados</h2><button type="button" class="btn ghost" onclick="newComunicado()">${icon('plus',14)}Novo comunicado</button></div>
  <div class="list">${comunicadoRows}</div>
  <div class="stats">
    <button type="button" class="stat ${p.semTarefas?'warn':''}" style="text-align:left;cursor:pointer;border:none;font:inherit;color:inherit;" onclick="verEscalasPendentes()"><div class="n">${p.semTarefas}</div><div class="l">Escalas sem tarefas distribuídas</div></button>
    ${SESSION.role!=='lider'?`<button type="button" class="stat ${p.emprestimosAtrasados?'bad':''}" style="text-align:left;cursor:pointer;border:none;font:inherit;color:inherit;" onclick="verEmprestimosAtrasados()"><div class="n">${p.emprestimosAtrasados}</div><div class="l">Empréstimos atrasados</div></button>`:''}
    <a class="stat" style="text-align:left;cursor:pointer;text-decoration:none;color:inherit;display:block;" href="#/aniversariantes"><div class="n">${p.bdays}</div><div class="l">Aniversariantes do mês</div></a>
    <a class="stat" style="text-align:left;cursor:pointer;text-decoration:none;color:inherit;display:block;" href="#/agenda"><div class="n">${p.reunioesHoje}</div><div class="l">Reuniões hoje (${p.reunioesSemana} na lista)</div></a>
  </div>
  <div class="grid">${mods}</div>
  <div class="sec-head"><h2>Escalas recentes</h2><a href="#/escala" class="muted">Ver tudo</a></div>
  <div class="list">${escalaRows}</div>
  <div class="sec-head"><h2>Eventos em preparação</h2><a href="#/eventos" class="muted">Ver tudo</a></div>
  <div class="list">${eventoRows||'<div class="row"><span class="rsub">Nenhum evento.</span></div>'}</div>`;
}

let escalaTab={ano:2026,mes:9};
function escalaPage(){
  let escalas=STATE.escalas;
  if(SESSION.role==='lider')escalas=escalas.filter(e=>e.celulaId===SESSION.celulaId);
  const anos=[2026,2027];
  const mesesComDados=[...new Set(escalas.filter(e=>+e.data.slice(0,4)===escalaTab.ano).map(e=>+e.data.slice(5,7)))].sort((a,b)=>a-b);
  const meses=mesesComDados.length?mesesComDados:[9];
  if(!meses.includes(escalaTab.mes))escalaTab.mes=meses[0];
  const tabsAno=anos.map(a=>`<button type="button" class="tab ${a===escalaTab.ano?'active':''}" onclick="escalaTab.ano=${a};route()">${a}</button>`).join('');
  const tabsMes=meses.map(m=>`<button type="button" class="tab ${m===escalaTab.mes?'active':''}" onclick="escalaTab.mes=${m};route()">${monthLabel(m)}</button>`).join('');
  const filtered=escalas.filter(e=>+e.data.slice(0,4)===escalaTab.ano&&+e.data.slice(5,7)===escalaTab.mes).sort((a,b)=>a.data.localeCompare(b.data));
  const rows=filtered.map(e=>{const c=celulaById(e.celulaId);const canEdit=SESSION.role!=='lider';return `<tr><td>${fmtDate(e.data)}</td><td>${e.culto}</td><td>${c?c.nome:'—'}</td><td>${e.tarefasDistribuidas?pill('ok','Tarefas distribuídas'):pill('wait','Pendente')}</td><td>${canEdit?actions(`editEscala('${e.id}')`,`delEscala('${e.id}')`):''}</td></tr>`;}).join('')||`<tr><td colspan="5" style="color:var(--muted)">Nenhuma escala neste mês.</td></tr>`;
  return pageHead('Escala de Culto','Escalas organizadas por ano e mês. Ao cadastrar, os líderes passam a visualizar a distribuição.',SESSION.role!=='lider'?{label:'Nova Escala',onclick:'newEscala()'}:null)+
  `<div class="tabs">${tabsAno}</div><div class="tabs">${tabsMes}</div>
  <div class="table-wrap"><table><thead><tr><th>Data</th><th>Culto</th><th>Célula</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function newEscala(editId){
  const e=editId?STATE.escalas.find(x=>x.id===editId):null;
  const opts=STATE.celulas.map(c=>`<option value="${c.id}" ${e&&e.celulaId===c.id?'selected':''}>${c.nome}</option>`).join('');
  openModal(e?'Editar escala':'Nova Escala','Selecione a data, o culto e a célula responsável.',
   `<div class="field-row"><div class="field"><label>Data</label><input type="date" name="data" value="${e?e.data:''}" required></div>
    <div class="field"><label>Culto</label><select name="culto"><option ${e&&e.culto==='Culto da Manhã'?'selected':''}>Culto da Manhã</option><option ${e&&e.culto==='Culto da Noite'?'selected':''}>Culto da Noite</option><option ${e&&e.culto==='Culto de Oração'?'selected':''}>Culto de Oração</option></select></div></div>
    <div class="field"><label>Célula</label><select name="celulaId" required>${opts}</select></div>`,
   (o)=>{ if(e){e.data=o.data;e.culto=o.culto;e.celulaId=o.celulaId;} else {STATE.escalas.push({id:uid(),data:o.data,culto:o.culto,celulaId:o.celulaId,tarefasDistribuidas:false,tarefas:[]});}
     escalaTab={ano:+o.data.slice(0,4),mes:+o.data.slice(5,7)}; save();route(); });
}
function editEscala(id){newEscala(id);}
function delEscala(id){confirmDelete('Excluir esta escala?',()=>{STATE.escalas=STATE.escalas.filter(e=>e.id!==id);save();route();});}

function celulasPage(){
  let list=STATE.celulas;
  if(SESSION.role==='lider')list=list.filter(c=>c.id===SESSION.celulaId);
  if(SESSION.role==='lider'&&!SESSION.celulaId){
    return pageHead('Células','Cadastre e acompanhe as células da igreja.')+`<div class="reminder" style="background:#E7EEFB;border-color:#C9DBF5;color:#1E4F9C;">${icon('warn',17)}Seu usuário ainda não está vinculado a nenhuma célula. Peça ao pastor ou ao administrador para concluir esse vínculo em Administração.</div>`;
  }
  const cards=list.map(c=>`<a class="card link" href="#/celulas/${c.id}"><div class="icon ic-purple">${icon('cells')}</div><div><h3>${c.nome}</h3><p>Líder: ${c.lider.nome}<br>${c.endereco}</p></div><div class="go">${c.membros.length} membros ${icon('chev',15)}</div></a>`).join('');
  return pageHead('Células','Cadastre e acompanhe as células da igreja.',SESSION.role!=='lider'?{label:'Nova Célula',onclick:'newCelula()'}:null,
    `<button type="button" class="btn ghost" onclick="exportCelulasPDF()">${icon('download',15)}PDF</button><button type="button" class="btn ghost" onclick="exportCelulasExcel()">${icon('download',15)}Excel</button>`)+`<div class="cell-grid">${cards}</div>`;
}
function newCelula(editId){
  const c=editId?celulaById(editId):null;
  openModal(c?'Editar célula':'Cadastrar nova célula','',
   `<div class="field"><label>Nome da célula</label><input name="nome" value="${c?c.nome:''}" required></div>
    <div class="field-row"><div class="field"><label>Data de início</label><input type="date" name="dataInicio" value="${c?c.dataInicio:''}"></div><div class="field"><label>Data prevista de multiplicação</label><input type="date" name="dataMultiplicacao" value="${c?c.dataMultiplicacao:''}"></div></div>
    <div class="field"><label>Endereço</label><input name="endereco" value="${c?c.endereco:''}"></div>
    <div class="field"><label>Líder — nome completo</label><input name="liderNome" value="${c?c.lider.nome:''}" required></div>
    <div class="field-row"><div class="field"><label>Data de nascimento do líder</label><input type="date" name="liderNascimento" value="${c?c.lider.nascimento:''}"></div><div class="field"><label>Telefone do líder</label><input name="liderTelefone" value="${c?c.lider.telefone:''}"></div></div>
    <div class="field-row"><div class="field"><label>Líder em treinamento</label><input name="liderTreinamento" value="${c?c.liderTreinamento:''}"></div><div class="field"><label>Anfitrião</label><input name="anfitriao" value="${c?c.anfitriao:''}"></div></div>`,
   (o)=>{ let celulaObj;
     if(c){c.nome=o.nome;c.dataInicio=o.dataInicio;c.dataMultiplicacao=o.dataMultiplicacao;c.endereco=o.endereco;c.lider={nome:o.liderNome,nascimento:o.liderNascimento,telefone:o.liderTelefone};c.liderTreinamento=o.liderTreinamento;c.anfitriao=o.anfitriao;celulaObj=c;}
     else {celulaObj={id:uid(),nome:o.nome,dataInicio:o.dataInicio,dataMultiplicacao:o.dataMultiplicacao,endereco:o.endereco,lider:{nome:o.liderNome,nascimento:o.liderNascimento,telefone:o.liderTelefone},liderTreinamento:o.liderTreinamento,anfitriao:o.anfitriao,membros:[],comunicados:[]};STATE.celulas.push(celulaObj);}
     if(o.liderNome&&o.liderNome.trim())syncLiderUser(celulaObj);
     save();renderShell();route(); });
}
function syncLiderUser(c){
  let u=STATE.users.find(x=>x.papel==='lider'&&x.celulaId===c.id);
  if(u){u.nome=c.nome;u.nascimento=c.lider.nascimento||'';u.telefone=c.lider.telefone||'';}
  else {STATE.users.push({id:uid(),nome:c.nome,papel:'lider',celulaId:c.id,nascimento:c.lider.nascimento||'',telefone:c.lider.telefone||'',senha:DEFAULT_SENHA});}
}
function delCelula(id){confirmDelete('Excluir esta célula e todos os seus cadastros?',()=>{STATE.celulas=STATE.celulas.filter(c=>c.id!==id);save();location.hash='#/celulas';});}

function celulaDetailPage(id){
  const c=celulaById(id); if(!c)return '<p>Célula não encontrada.</p>';
  const canManage=SESSION.role!=='lider'||SESSION.celulaId===id;
  const pendentes=STATE.escalas.filter(e=>e.celulaId===id&&!e.tarefasDistribuidas);
  const reminders=pendentes.map(e=>`<div class="reminder">${icon('warn',17)}Distribuir tarefas para o culto de ${fmtDate(e.data)} (${e.culto})<button type="button" onclick="distribuirTarefas('${e.id}')">Distribuir</button></div>`).join('');
  const podeExcluir=SESSION.role!=='lider';
  const membrosRows=c.membros.map(m=>`<div class="row"><div class="person"><div class="av">${initials(m.nome)}</div><div><div class="rtitle">${m.nome} ${pill(m.tipo==='membro'?'info':'wait',m.tipo==='membro'?'Membro':'Visitante')}</div><div class="rsub">${fmtDate(m.nascimento)} · ${m.telefone||'—'}</div></div></div><div class="rright">${canManage?actions(`editMembro('${c.id}','${m.id}')`,podeExcluir?`delMembro('${c.id}','${m.id}')`:null):''}</div></div>`).join('')||'<div class="row"><span class="rsub">Nenhum membro cadastrado.</span></div>';
  return `<a class="detail-back" href="#/celulas">${icon('back',15)}Voltar para Células</a>
  ${pageHead(c.nome,'Detalhes, membros e comunicados da célula.',canManage?{label:'Editar célula',onclick:`newCelula('${c.id}')`}:null)}
  ${reminders}
  <div class="info-grid">
    <div><span>Líder</span><b>${c.lider.nome}</b></div><div><span>Telefone do líder</span><b>${c.lider.telefone||'—'}</b></div>
    <div><span>Líder em treinamento</span><b>${c.liderTreinamento||'—'}</b></div><div><span>Anfitrião</span><b>${c.anfitriao||'—'}</b></div>
    <div><span>Endereço</span><b>${c.endereco||'—'}</b></div><div><span>Início</span><b>${fmtDate(c.dataInicio)}</b></div>
    <div><span>Multiplicação prevista</span><b>${fmtDate(c.dataMultiplicacao)}</b></div>
    ${SESSION.role!=='lider'?`<div><span>Excluir</span><button type="button" class="btn danger" style="width:fit-content" onclick="delCelula('${c.id}')">${icon('trash',14)}Excluir célula</button></div>`:''}
  </div>
  <div class="subblock"><div class="sec-head" style="margin-top:0"><h2>Membros e visitantes</h2>${canManage?`<button type="button" class="btn ghost" onclick="newMembro('${c.id}')">${icon('plus',14)}Adicionar</button>`:''}</div><div class="list">${membrosRows}</div></div>`;
}
function newMembro(celulaId,membroId){
  const c=celulaById(celulaId); const m=membroId?c.membros.find(x=>x.id===membroId):null;
  openModal(m?'Editar cadastro':'Novo membro / visitante','',
   `<div class="field"><label>Nome completo</label><input name="nome" value="${m?m.nome:''}" required></div>
    <div class="field-row"><div class="field"><label>Data de nascimento</label><input type="date" name="nascimento" value="${m?m.nascimento:''}"></div><div class="field"><label>Telefone</label><input name="telefone" value="${m?m.telefone:''}"></div></div>
    <div class="field"><label>Tipo</label><select name="tipo"><option value="membro" ${m&&m.tipo==='membro'?'selected':''}>Membro fixo</option><option value="visitante" ${m&&m.tipo==='visitante'?'selected':''}>Visitante</option></select></div>`,
   (o)=>{ if(m){m.nome=o.nome;m.nascimento=o.nascimento;m.telefone=o.telefone;m.tipo=o.tipo;} else {c.membros.push({id:uid(),nome:o.nome,nascimento:o.nascimento,telefone:o.telefone,tipo:o.tipo});}
     save();route(); });
}
function editMembro(cid,mid){newMembro(cid,mid);}
function delMembro(cid,mid){confirmDelete('Remover este cadastro?',()=>{const c=celulaById(cid);c.membros=c.membros.filter(m=>m.id!==mid);save();route();});}

/* ---------- comunicados (globais, na Visão Geral) ---------- */
function comunicadosVisiveis(){
  return STATE.comunicados.filter(cm=>SESSION.role==='pastor'||SESSION.role==='admin'||cm.autorId===SESSION.userId||cm.destinatarios.includes(SESSION.userId));
}
function comunicadoRow(cm){
  const isRecipient=cm.destinatarios.includes(SESSION.userId);
  const lido=cm.lidos.includes(SESSION.userId);
  const autor=STATE.users.find(u=>u.id===cm.autorId);
  const canManage=cm.autorId===SESSION.userId||SESSION.role==='pastor'||SESSION.role==='admin';
  const destNomes=cm.destinatarios.map(did=>{const u=STATE.users.find(x=>x.id===did);return u?u.nome:'(removido)';});
  return `<div class="row" style="align-items:flex-start;">
    <div style="flex:1;min-width:0;">
      <div class="rtitle">${cm.texto}</div>
      <div class="rsub">${autor?autor.nome:'—'} · ${fmtDate(cm.data)} · Para: ${destNomes.join(', ')||'ninguém selecionado'}</div>
      ${canManage?`<div class="rsub" style="margin-top:4px;"><a href="#" onclick="verVisualizacoes('${cm.id}');return false;">${cm.lidos.length}/${cm.destinatarios.length} visualizaram</a></div>`:''}
    </div>
    <div class="rright" style="flex-direction:column;align-items:flex-end;gap:8px;">
      ${isRecipient?`<label class="checkline"><input type="checkbox" ${lido?'checked':''} onchange="toggleLeituraComunicado('${cm.id}')">Já vi</label>`:''}
      ${canManage?actions(`editComunicado('${cm.id}')`,SESSION.role==='pastor'||SESSION.role==='admin'?`delComunicado('${cm.id}')`:null):''}
    </div>
  </div>`;
}
function verVisualizacoes(id){
  const cm=STATE.comunicados.find(x=>x.id===id); if(!cm)return;
  const rows=cm.destinatarios.map(did=>{const u=STATE.users.find(x=>x.id===did);const lido=cm.lidos.includes(did);
    return `<div class="row"><div class="person"><div class="av">${initials(u?u.nome:'?')}</div><div class="rtitle">${u?u.nome:'Usuário removido'}</div></div><div class="rright">${lido?pill('ok','Visualizou'):pill('wait','Não visualizou')}</div></div>`;}).join('')||'<div class="row"><span class="rsub">Nenhum destinatário.</span></div>';
  document.getElementById('modalBox').innerHTML=`<h3>Quem visualizou</h3><div class="msub">${cm.texto}</div><div class="list">${rows}</div><div class="modal-actions"><button type="button" class="btn ghost" id="modalCancel">Fechar</button></div>`;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalCancel').onclick=closeModal;
}
function toggleLeituraComunicado(id){
  const cm=STATE.comunicados.find(x=>x.id===id); if(!cm)return;
  const idx=cm.lidos.indexOf(SESSION.userId);
  if(idx>-1)cm.lidos.splice(idx,1); else cm.lidos.push(SESSION.userId);
  save();route();
}
function newComunicado(editId){
  const cm=editId?STATE.comunicados.find(x=>x.id===editId):null;
  const outros=STATE.users.filter(u=>u.id!==SESSION.userId);
  const destOpts=outros.map(u=>`<label class="checkline" style="margin-bottom:8px;"><input type="checkbox" name="dest_${u.id}" ${cm&&cm.destinatarios.includes(u.id)?'checked':''}>${u.nome} <span style="color:var(--muted);font-weight:400;">(${u.papel==='pastor'?'Pastor':u.papel==='admin'?'Administrador':'Líder'})</span></label>`).join('');
  openModal(cm?'Editar comunicado':'Novo comunicado','Escolha para quais usuários cadastrados este comunicado vai aparecer.',
   `<div class="field"><label>Mensagem</label><textarea name="texto" required>${cm?cm.texto:''}</textarea></div>
    <div class="field"><label>Enviar para</label>${destOpts||'<div class="rsub">Nenhum outro usuário cadastrado ainda.</div>'}</div>`,
   (o)=>{
     const destinatarios=Object.keys(o).filter(k=>k.startsWith('dest_')).map(k=>k.slice(5));
     if(cm){cm.texto=o.texto;cm.destinatarios=destinatarios;cm.lidos=cm.lidos.filter(uid2=>destinatarios.includes(uid2));}
     else {STATE.comunicados.unshift({id:uid(),texto:o.texto,data:todayISO(),autorId:SESSION.userId,destinatarios,lidos:[]});}
     save();route();
   });
}
function editComunicado(id){newComunicado(id);}
function delComunicado(id){confirmDelete('Excluir este comunicado?',()=>{STATE.comunicados=STATE.comunicados.filter(x=>x.id!==id);save();route();});}
function distribuirTarefas(escalaId){
  const e=STATE.escalas.find(x=>x.id===escalaId); const c=celulaById(e.celulaId);
  const tarefasPadrao=['Recepção','Louvor','Palavra','Oração'];
  const membroOpts=c.membros.map(m=>`<option value="${m.nome}">${m.nome}</option>`).join('');
  const body=tarefasPadrao.map(t=>`<div class="field"><label>${t}</label><select name="t_${t}"><option value="">— selecionar —</option>${membroOpts}</select></div>`).join('');
  openModal('Distribuir tarefas',`${e.culto} · ${fmtDate(e.data)} · ${c.nome}`,body,(o)=>{
    e.tarefas=tarefasPadrao.filter(t=>o['t_'+t]).map(t=>({tarefa:t,membroNome:o['t_'+t]}));
    e.tarefasDistribuidas=e.tarefas.length>0; save();route();
  });
}

function eventoProgresso(e){
  let total=0,done=0;
  total+=e.checklist.length; done+=e.checklist.filter(c=>c.concluido).length;
  if(e.usarCelulas){
    total+=e.celulasEnvolvidas.length;done+=e.celulasEnvolvidas.filter(c=>c.concluido).length;
    e.celulasEnvolvidas.forEach(c=>{(c.checklist||[]).forEach(k=>{total++;if(k.concluido)done++;});});
  }
  if(e.usarCronograma){total+=e.cronograma.length;done+=e.cronograma.filter(c=>c.concluido).length;}
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function eventoPendenciasList(e){
  const rows=[];
  e.checklist.filter(c=>!c.concluido).forEach(c=>rows.push({tipo:'Checklist',item:c.tarefa,resp:c.responsavel}));
  if(e.usarCelulas)e.celulasEnvolvidas.forEach(c=>{
    const cel=celulaById(c.celulaId);
    const nomeResp=cel?cel.nome+' — líder '+cel.lider.nome:'célula removida';
    if(!c.concluido)rows.push({tipo:'Célula',item:(c.area||'(sem área definida)')+(c.prazo?' · prazo '+fmtDate(c.prazo):''),resp:nomeResp});
    (c.checklist||[]).filter(k=>!k.concluido).forEach(k=>rows.push({tipo:'Checklist — '+(cel?cel.nome:'célula'),item:k.tarefa,resp:nomeResp}));
  });
  if(e.usarCronograma)e.cronograma.filter(c=>!c.concluido).forEach(c=>rows.push({tipo:'Cronograma',item:fmtDate(c.data)+(c.descricao?' — '+c.descricao:' — sem descrição ainda'),resp:'—'}));
  return rows;
}
function verPendenciasEvento(id){

  </div>

  <div class="subblock"><div class="sec-head" style="margin-top:0"><h2>Checklist de preparação</h2>${canManage?`<button type="button" class="btn ghost" onclick="newChecklistItem('${e.id}')">${icon('plus',14)}Adicionar item</button>`:''}</div><div class="list">${checkRows}</div></div>

/* --- Células responsáveis por área --- */
function renderCelulasEnvolvidasSection(e,canManage){
  if(!e.usarCelulas)return canManage?`<button type="button" class="btn ghost" style="margin-bottom:20px;" onclick="toggleEventoSecao('${e.id}','usarCelulas')">${icon('plus',14)}Adicionar Células por Área</button>`:'';
  const rows=e.celulasEnvolvidas.map(c=>{
    const cel=celulaById(c.celulaId);
    const podeEditarEstaLinha=canManage||(SESSION.role==='lider'&&SESSION.celulaId===c.celulaId);
    const atrasado=c.prazo&&c.prazo<todayISO()&&!c.concluido;
    const cksDone=(c.checklist||[]).filter(k=>k.concluido).length;
    const cksTotal=(c.checklist||[]).length;
    const cksRows=(c.checklist||[]).map(k=>`<div class="check-row" style="padding:6px 0;"><input type="checkbox" ${k.concluido?'checked':''} ${podeEditarEstaLinha?'':'disabled'} onchange="toggleCelulaChecklistItem('${e.id}','${c.id}','${k.id}')"><div style="flex:1"><div class="ctitle ${k.concluido?'done':''}" style="font-size:13px;">${k.tarefa}</div></div>${canManage?actions(null,`delCelulaChecklistItem('${e.id}','${c.id}','${k.id}')`):''}</div>`).join('');
    return `<div class="row" style="align-items:flex-start;"><div style="flex:1;min-width:0;">
      <div class="rtitle">${cel?cel.nome:'(célula removida)'}${cel?' — Líder: '+cel.lider.nome:''}</div>
      <div class="rsub">${c.area||'(sem área definida)'}${c.comida?' · Comida: '+c.comida:''}</div>
      <div class="rsub" style="margin-top:2px;">${c.prazo?(atrasado?pill('bad','Atrasado — prazo '+fmtDate(c.prazo)):'Prazo: '+fmtDate(c.prazo)):''}</div>
      ${podeEditarEstaLinha?`<label class="checkline" style="margin-top:6px;"><input type="checkbox" ${c.concluido?'checked':''} onchange="toggleCelulaEnvolvidaConcluida('${e.id}','${c.id}')">Área concluída</label>`:''}
      ${cksTotal?`<div style="margin-top:8px;padding-left:10px;border-left:2px solid var(--line);">${cksRows}</div><div class="rsub" style="margin-top:2px;">${cksDone}/${cksTotal} itens do checklist</div>`:''}
      ${podeEditarEstaLinha?`<button type="button" class="btn ghost" style="margin-top:8px;padding:4px 10px;font-size:12px;" onclick="newCelulaChecklistItem('${e.id}','${c.id}')">${icon('plus',13)}Adicionar item ao checklist (opcional)</button>`:''}
    </div><div class="rright">${podeEditarEstaLinha?actions(`newCelulaEnvolvida('${e.id}','${c.id}')`,canManage?`delCelulaEnvolvida('${e.id}','${c.id}')`:null):''}</div></div>`;
  }).join('')||'<div class="row"><span class="rsub">Nenhuma célula vinculada ainda.</span></div>';
  return `<div class="subblock"><div class="sec-head"><h2>Células responsáveis por área</h2><div style="display:flex;gap:6px;">${canManage?`<button type="button" class="btn ghost" onclick="newCelulaEnvolvida('${e.id}')">${icon('plus',14)}Adicionar</button><button type="button" class="iconbtn del" title="Remover esta seção" onclick="toggleEventoSecao('${e.id}','usarCelulas')">${icon('trash',15)}</button>`:''}</div></div><div class="list">${rows}</div></div>`;
}
function newCelulaEnvolvida(eventoId,rowId){
  const e=STATE.eventos.find(x=>x.id===eventoId); const row=rowId?e.celulasEnvolvidas.find(x=>x.id===rowId):null;
  const isPastorAdmin=SESSION.role!=='lider';
  const celulaOpts=STATE.celulas.map(c=>`<option value="${c.id}" ${row&&row.celulaId===c.id?'selected':''}>${c.nome} — ${c.lider.nome}</option>`).join('');
  openModal(row?'Editar célula na área':'Adicionar célula por área','',
   isPastorAdmin?
   `<div class="field"><label>Célula</label><select name="celulaId" ${row?'disabled':''}>${celulaOpts}</select>${row?`<input type="hidden" name="celulaId" value="${row.celulaId}">`:''}</div>
    <div class="field"><label>Área / responsabilidade</label><input name="area" value="${row?row.area:''}" required></div>
    <div class="field-row"><div class="field"><label>Prazo (opcional)</label><input type="date" name="prazo" value="${row?row.prazo||'':''}"></div><div class="field"><label>Comida (opcional)</label><input name="comida" value="${row?row.comida:''}"></div></div>`
   :
   `<div class="field"><label>Comida</label><input name="comida" value="${row?row.comida:''}" placeholder="O que sua célula vai trazer"></div>`,
   (o)=>{
     if(row){
       if(isPastorAdmin){row.area=o.area;row.prazo=o.prazo||'';} row.comida=o.comida||'';
     } else {
       e.celulasEnvolvidas.push({id:uid(),celulaId:o.celulaId,area:o.area||'',prazo:o.prazo||'',comida:o.comida||'',concluido:false,checklist:[]});
     }
     save();route();
   });
}
function delCelulaEnvolvida(eid,rid){confirmDelete('Remover esta célula da área?',()=>{const e=STATE.eventos.find(x=>x.id===eid);e.celulasEnvolvidas=e.celulasEnvolvidas.filter(c=>c.id!==rid);save();route();});}
function toggleCelulaEnvolvidaConcluida(eid,rid){const e=STATE.eventos.find(x=>x.id===eid);const r=e.celulasEnvolvidas.find(c=>c.id===rid);r.concluido=!r.concluido;save();route();}

function delCelulaChecklistItem(eid,rid,kid){confirmDelete('Remover este item?',()=>{const e=STATE.eventos.find(x=>x.id===eid);const r=e.celulasEnvolvidas.find(x=>x.id===rid);r.checklist=r.checklist.filter(k=>k.id!==kid);save();route();});}

function delMinistrador(eid,mid){confirmDelete('Remover esta palavra?',()=>{const e=STATE.eventos.find(x=>x.id===eid);e.ministradores=e.ministradores.filter(m=>m.id!==mid);save();route();});}

function renderCronogramaSection(e,canManage){
  if(!e.usarCronograma)return canManage?`<button type="button" class="btn ghost" style="margin-bottom:20px;" onclick="toggleEventoSecao('${e.id}','usarCronograma')">${icon('plus',14)}Adicionar Cronograma</button>`:'';
  const ordenado=[...e.cronograma].sort((a,b)=>a.data.localeCompare(b.data));
  const rows=ordenado.map(c=>`<div class="row"><label class="checkline" style="flex:1;"><input type="checkbox" ${c.concluido?'checked':''} ${canManage?'':'disabled'} onchange="toggleCronogramaItem('${e.id}','${c.id}')"><div><div class="rtitle ${c.concluido?'done':''}">${fmtDate(c.data)}</div><div class="rsub">${c.descricao||'Sem descrição ainda'}</div></div></label><div class="rright">${canManage?actions(`newCronogramaItem('${e.id}','${c.id}')`,`delCronogramaItem('${e.id}','${c.id}')`):''}</div></div>`).join('')||'<div class="row"><span class="rsub">Nenhum item no cronograma.</span></div>';
  return `<div class="subblock"><div class="sec-head"><h2>Cronograma de preparação</h2><div style="display:flex;gap:6px;">${canManage?`<button type="button" class="btn ghost" onclick="newCronogramaItem('${e.id}')">${icon('plus',14)}Adicionar</button><button type="button" class="iconbtn del" title="Remover esta seção" onclick="toggleEventoSecao('${e.id}','usarCronograma')">${icon('trash',15)}</button>`:''}</div></div><div class="list">${rows}</div></div>`;
}
function newCronogramaItem(eventoId,itemId){

   `<div class="field"><label>Data</label><input type="date" name="data" value="${c?c.data:''}" required></div>

   (o)=>{if(c){c.data=o.data;c.descricao=o.descricao;} else {e.cronograma.push({id:uid(),data:o.data,descricao:o.descricao,concluido:false});}
     save();route();});
}
function delCronogramaItem(eid,cid){confirmDelete('Remover este item do cronograma?',()=>{const e=STATE.eventos.find(x=>x.id===eid);e.cronograma=e.cronograma.filter(c=>c.id!==cid);save();route();});}
function toggleCronogramaItem(eid,cid){const e=STATE.eventos.find(x=>x.id===eid);const c=e.cronograma.find(x=>x.id===cid);c.concluido=!c.concluido;save();route();}

function pendenciasAtribuidas(){
  const rows=[];
  STATE.eventos.forEach(e=>{
    if(!e.usarCelulas)return;
    e.celulasEnvolvidas.forEach(c=>{
      if(!c.prazo||c.concluido)return;
      if(SESSION.role==='lider'&&c.celulaId!==SESSION.celulaId)return;
      const cel=celulaById(c.celulaId);
      rows.push({eventoId:e.id,eventoNome:e.nome,celula:cel?cel.nome:'—',area:c.area,prazo:c.prazo,atrasado:c.prazo<todayISO()});
    });
  });
  return rows.sort((a,b)=>a.prazo.localeCompare(b.prazo));
}
function agendaPage(){
  const my=STATE.agenda.filter(a=>a.userId===SESSION.userId||a.compartilhado).sort((a,b)=>a.data.localeCompare(b.data));
  const hoje=my.filter(a=>a.data===todayISO()).length;

    <button type="button" class="stat" style="text-align:left;cursor:pointer;border:none;font:inherit;color:inherit;" onclick="document.getElementById('agendaListaAnchor').scrollIntoView({behavior:'smooth',block:'start'})"><div class="n">${my.length}</div><div class="l">Reuniões na lista</div></button>

function editAgenda(id){newAgenda(id);}
function delAgenda(id){confirmDelete('Excluir este compromisso?',()=>{STATE.agenda=STATE.agenda.filter(a=>a.id!==id);save();route();});}

let bdayTab=null;
function aniversariantesPage(){
  let pessoas=[];
  STATE.celulas.forEach(c=>{ if(SESSION.role==='lider'&&c.id!==SESSION.celulaId)return;
    c.membros.forEach(m=>{if(m.nascimento)pessoas.push({nome:m.nome,nascimento:m.nascimento,celula:c.nome});});
    if(c.lider.nascimento)pessoas.push({nome:c.lider.nome+' (líder)',nascimento:c.lider.nascimento,celula:c.nome});
  });
  const comps=[...new Set(pessoas.map(p=>p.nascimento.slice(5,7)))].sort();
  if(!bdayTab||!comps.includes(bdayTab))bdayTab=comps[0]||'09';
  const tabs=comps.map(m=>`<button type="button" class="tab ${m===bdayTab?'active':''}" onclick="bdayTab='${m}';route()">${monthLabel(+m)}</button>`).join('');
  const rows=pessoas.filter(p=>p.nascimento.slice(5,7)===bdayTab).sort((a,b)=>a.nascimento.slice(8,10)-b.nascimento.slice(8,10)).map(p=>
    `<div class="row"><div class="person"><div class="av">${initials(p.nome)}</div><div><div class="rtitle">${p.nome}</div><div class="rsub">${p.celula}</div></div></div><div class="rright">${p.nascimento.slice(8,10)} ${monthLabel(+bdayTab)}</div></div>`).join('')||'<div class="row"><span class="rsub">Nenhum aniversariante nesta competência.</span></div>';
  return pageHead('Aniversariantes','Extraído automaticamente do cadastro das células, por competência (ano/mês).')+`<div class="tabs">${tabs}</div><div class="list">${rows}</div>`;
}

function adminPage(){
  const rows=STATE.users.map(u=>{

    const rolePill=u.papel==='pastor'?'info':u.papel==='admin'?'ok':'wait';
    const celulaTxt=u.papel==='lider'?(u.celulaId?celulaById(u.celulaId).nome:'Sem célula vinculada'):'—';

  }).join('');
  return pageHead('Administração','Cadastre usuários, defina papéis de acesso e vincule líderes às células.',{label:'Novo usuário',onclick:'newUsuario()'})+
  `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Papel</th><th>Célula</th><th>Nascimento</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

function newUsuario(editId){
  const u=editId?STATE.users.find(x=>x.id===editId):null;
  const celulaOpts='<option value="">— nenhuma (definir depois) —</option>'+STATE.celulas.map(c=>`<option value="${c.id}" ${u&&u.celulaId===c.id?'selected':''}>${c.nome}</option>`).join('');
  const isLider=!u||u.papel==='lider';
  openModal(u?'Editar usuário':'Novo usuário',u?'':'A senha inicial de acesso será <b>'+DEFAULT_SENHA+'</b>. O login é feito com o nome completo.',
   `<div class="field"><label>Nome completo</label><input name="nome" value="${u?u.nome:''}" required></div>
    <div class="field"><label>Papel de acesso</label><select name="papel" onchange="document.getElementById('celulaField').style.display=this.value==='lider'?'block':'none'">
      <option value="pastor" ${u&&u.papel==='pastor'?'selected':''}>Pastor — vê tudo</option>
      <option value="admin" ${u&&u.papel==='admin'?'selected':''}>Administrador — cadastra usuários e administra o sistema</option>
      <option value="lider" ${isLider?'selected':''}>Líder — vê e adiciona apenas sua célula e eventos</option>
    </select></div>
    <div id="celulaField" style="display:${isLider?'block':'none'}">
      <div class="field"><label>Célula vinculada</label><select name="celulaId">${celulaOpts}</select></div>
      <div class="field-row"><div class="field"><label>Data de nascimento</label><input type="date" name="nascimento" value="${u&&u.nascimento?u.nascimento:''}"></div><div class="field"><label>Telefone</label><input name="telefone" value="${u&&u.telefone?u.telefone:''}"></div></div>
    </div>`,
   (o)=>{
     const obj={nome:o.nome,papel:o.papel};
     if(o.papel==='lider'){obj.celulaId=o.celulaId||null;obj.nascimento=o.nascimento||'';obj.telefone=o.telefone||'';}
     else {obj.celulaId=null;obj.nascimento='';obj.telefone='';}
     let saved;
     if(u){Object.assign(u,obj);saved=u;} else {saved={id:uid(),senha:DEFAULT_SENHA,...obj};STATE.users.push(saved);}
     if(obj.papel==='lider'&&obj.celulaId){const c=celulaById(obj.celulaId);c.lider={nome:obj.nome,nascimento:obj.nascimento,telefone:obj.telefone};}
     save();
     if(SESSION&&SESSION.userId===saved.id){setSessionFromUser(saved);renderShell();}
     route();
   });
}
function editUsuario(id){newUsuario(id);}
function delUsuario(id){confirmDelete('Excluir este usuário? Ele perderá o acesso ao painel.',()=>{
  STATE.users=STATE.users.filter(u=>u.id!==id);

  save();
  if(SESSION.userId===id){logout();} else {renderShell();route();}
});}

function exportAgendaExcel(){

function exportEventosPDF(){
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF();
    doc.setFontSize(14); doc.text('Eventos',14,16);
    let y=24;
    STATE.eventos.forEach(e=>{
      if(y>250){doc.addPage();y=16;}
      doc.setFontSize(12); doc.text(e.nome+(e.data?' — '+fmtDate(e.data):''),14,y); y+=6;
      if(e.usarFuncoes&&e.funcoes.length){
        doc.setFontSize(9); doc.text('Funções do Evento',14,y); y+=2;
        doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},head:[['Cargo','Nome']],body:e.funcoes.map(f=>[f.cargo,f.nome])});
        y=doc.lastAutoTable.finalY+6;
      }
      if(e.usarEquipes&&e.equipes.length){
        if(y>250){doc.addPage();y=16;}
        doc.setFontSize(9); doc.text('Equipes de Trabalho',14,y); y+=2;
        doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},head:[['Equipe','Líder','Área','Membros']],body:e.equipes.map(q=>[q.nome,q.lider,q.area,q.membros])});
        y=doc.lastAutoTable.finalY+6;
      }
      if(e.usarCelulas&&e.celulasEnvolvidas.length){
        if(y>250){doc.addPage();y=16;}
        doc.setFontSize(9); doc.text('Células por Área',14,y); y+=2;
        doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},head:[['Célula','Líder','Área','Comida','Concluído']],
          body:e.celulasEnvolvidas.map(c=>{const cel=celulaById(c.celulaId);return [cel?cel.nome:'—',cel?cel.lider.nome:'—',c.area,c.comida||'—',c.concluido?'Sim':'Não'];})});
        y=doc.lastAutoTable.finalY+6;
      }
      if(e.usarMinistradores&&e.ministradores.length){
        if(y>250){doc.addPage();y=16;}
        doc.setFontSize(9); doc.text('Ministradores / Palavras',14,y); y+=2;
        doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},head:[['#','Palavra','Ministrador']],body:[...e.ministradores].sort((a,b)=>a.ordem-b.ordem).map(m=>[m.ordem,m.titulo,m.ministrador])});
        y=doc.lastAutoTable.finalY+6;
      }
      if(e.usarCronograma&&e.cronograma.length){
        if(y>250){doc.addPage();y=16;}
        doc.setFontSize(9); doc.text('Cronograma',14,y); y+=2;
        doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},head:[['Data','Descrição','Concluído']],body:[...e.cronograma].sort((a,b)=>a.data.localeCompare(b.data)).map(c=>[fmtDate(c.data),c.descricao||'—',c.concluido?'Sim':'Não'])});
        y=doc.lastAutoTable.finalY+6;
      }
      doc.setFontSize(9); doc.text('Checklist de preparação',14,y); y+=2;
      doc.autoTable({startY:y,margin:{left:14},styles:{fontSize:8},
        head:[['Tarefa','Responsável','Concluído']],
        body:e.checklist.length?e.checklist.map(c=>[c.tarefa,c.responsavel,c.concluido?'Sim':'Não']):[['—','—','—']],
      });
      y=doc.lastAutoTable.finalY+12;
    });
    doc.save('eventos-videira.pdf');
  }catch(e){alert('Não foi possível gerar o PDF. Verifique sua conexão com a internet.');}
}
function exportEventosExcel(){
  try{
    const wb=XLSX.utils.book_new();
    const checklistRows=[]; const funcoesRows=[]; const equipesRows=[]; const celulasRows=[]; const ministradoresRows=[]; const cronogramaRows=[];
    STATE.eventos.forEach(e=>{
      if(e.checklist.length===0)checklistRows.push({Evento:e.nome,Tarefa:'',Responsável:'',Concluído:''});
      else e.checklist.forEach(c=>checklistRows.push({Evento:e.nome,Tarefa:c.tarefa,Responsável:c.responsavel,Concluído:c.concluido?'Sim':'Não'}));
      if(e.usarFuncoes)e.funcoes.forEach(f=>funcoesRows.push({Evento:e.nome,Cargo:f.cargo,Nome:f.nome}));
      if(e.usarEquipes)e.equipes.forEach(q=>equipesRows.push({Evento:e.nome,Equipe:q.nome,Líder:q.lider,Área:q.area,Membros:q.membros}));
      if(e.usarCelulas)e.celulasEnvolvidas.forEach(c=>{const cel=celulaById(c.celulaId);celulasRows.push({Evento:e.nome,Célula:cel?cel.nome:'—',Líder:cel?cel.lider.nome:'—',Área:c.area,Comida:c.comida,Concluído:c.concluido?'Sim':'Não'});});
      if(e.usarMinistradores)e.ministradores.forEach(m=>ministradoresRows.push({Evento:e.nome,Ordem:m.ordem,Palavra:m.titulo,Ministrador:m.ministrador}));
      if(e.usarCronograma)e.cronograma.forEach(c=>cronogramaRows.push({Evento:e.nome,Data:fmtDate(c.data),Descrição:c.descricao,Concluído:c.concluido?'Sim':'Não'}));
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(checklistRows),'Checklist');
    if(funcoesRows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(funcoesRows),'Funções');
    if(equipesRows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(equipesRows),'Equipes');
    if(celulasRows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(celulasRows),'Células por Área');
    if(ministradoresRows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ministradoresRows),'Ministradores');
    if(cronogramaRows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cronogramaRows),'Cronograma');
    XLSX.writeFile(wb,'eventos-videira.xlsx');
  }catch(e){alert('Não foi possível gerar o Excel. Verifique sua conexão com a internet.');}
}
function exportCelulasPDF(){
  try{
    const list=celulasVisiveisParaExport();
    const {jsPDF}=window.jspdf; const doc=new jsPDF();
    doc.setFontSize(14); doc.text('Relação de Células',14,16);
    doc.autoTable({startY:22,head:[['Célula','Líder','Telefone','Endereço','Início','Membros']],
      body:list.map(c=>[c.nome,c.lider.nome,c.lider.telefone||'—',c.endereco||'—',fmtDate(c.dataInicio),String(c.membros.length)])});
    doc.save('celulas-videira.pdf');
  }catch(e){alert('Não foi possível gerar o PDF. Verifique sua conexão com a internet.');}
}
function exportCelulasExcel(){
  try{
    const list=celulasVisiveisParaExport();
    const rows=list.map(c=>({Célula:c.nome,Líder:c.lider.nome,'Telefone do líder':c.lider.telefone||'','Líder em treinamento':c.liderTreinamento||'',Anfitrião:c.anfitriao||'',Endereço:c.endereco||'',Início:fmtDate(c.dataInicio),'Multiplicação prevista':fmtDate(c.dataMultiplicacao),'Qtde membros':c.membros.length}));
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Células'); XLSX.writeFile(wb,'celulas-videira.xlsx');
  }catch(e){alert('Não foi possível gerar o Excel. Verifique sua conexão com a internet.');}
}

const ROUTES={
  overview:{title:'Visão Geral',render:overviewPage}, escala:{title:'Escala de Culto',render:escalaPage},
  celulas:{title:'Células',render:celulasPage}, eventos:{title:'Eventos',render:eventosPage},
  emprestimos:{title:'Empréstimos',render:emprestimosPage}, agenda:{title:'Agenda',render:agendaPage},
  aniversariantes:{title:'Aniversariantes',render:aniversariantesPage},
  admin:{title:'Administração',render:adminPage},
};
function renderNav(active){document.getElementById('nav').innerHTML=visibleModules().map(m=>`<a href="#/${m.id}" class="${m.id===active?'active':''}">${icon(m.icon,19)}<span>${m.label}</span></a>`).join('');}
function route(){
  const parts=(location.hash.replace('#/','')||'overview').split('/');
  const base=parts[0]; const sub=parts[1];
  let html,title,activeNav=base;
  if(base==='celulas'&&sub){html=celulaDetailPage(sub);title='Células';}
  else if(base==='eventos'&&sub){html=eventoDetailPage(sub);title='Eventos';}
  else if(ROUTES[base]&&visibleModules().some(m=>m.id===base)){html=ROUTES[base].render();title=ROUTES[base].title;}
  else {html=overviewPage();title='Visão Geral';activeNav='overview';}
  document.getElementById('pageTitle').textContent=title;
  document.getElementById('content').innerHTML=html;
  renderNav(activeNav); closeSidebar(); window.scrollTo(0,0);
}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
document.getElementById('hamburger').addEventListener('click',openSidebar);
document.getElementById('overlay').addEventListener('click',closeSidebar);
window.addEventListener('hashchange',route);

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginSenha').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('loginNome').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginSenha').focus();});
document.getElementById('logoutBtn').addEventListener('click',logout);

load();
if(tryAutoLogin()){showApp();renderShell();route();} else {showLogin();}
</script>
